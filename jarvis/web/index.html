<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hud">
        <header class="hud-header">
            <span class="brand">J.A.R.V.I.S.</span>
            <span class="status-badge" id="statusBadge">ONLINE</span>
        </header>

        <div class="core-wrap">
            <div class="core" id="core">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
                <div class="core-center"></div>
            </div>
            <div class="core-status" id="coreStatus">STANDING BY</div>
        </div>

        <div class="console">
            <div class="log" id="log"></div>

            <form class="input-row" id="inputForm">
                <button type="button" class="mic-btn" id="micBtn" title="Hold to talk">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
                        <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V21H8a1 1 0 0 0 0 2h8a1 1 0 0 0 0-2h-3v-3.08A7 7 0 0 0 19 11z"/>
                    </svg>
                </button>
                <input type="text" id="textInput" placeholder="Talk to Jarvis..." autocomplete="off" />
                <button type="submit" class="send-btn">SEND</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
